<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Illustrated coastal maritime campus</title><desc id="desc">A refined editorial illustration of a modern marine education campus by the Atlantic, with a training vessel and rugged Newfoundland coastline.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8ed4f2"/><stop offset=".68" stop-color="#f3d8b0"/><stop offset="1" stop-color="#f9c98d"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#4b9dbb"/><stop offset="1" stop-color="#123d5a"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#c5f0f4"/><stop offset=".45" stop-color="#4d91a8"/><stop offset="1" stop-color="#173d58"/></linearGradient>
