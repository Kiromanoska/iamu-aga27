 <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#466e68"/><stop offset="1" stop-color="#1b4145"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#687b83"/><stop offset="1" stop-color="#263d4b"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="18"/></filter>
